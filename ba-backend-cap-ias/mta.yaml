_schema-version: '3.1'
ID: ba-backend-cap-ias
version: 1.0.0
description: "SAP CAP Backend + Angular Frontend for Bachelor Thesis - SAP IAS Integration"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production

modules:
  # --------------------- SERVER MODULE ------------------------
  - name: ba-backend-cap-ias-srv
    type: java
    path: srv
    parameters:
      buildpack: sap_java_buildpack_jakarta
      memory: 1024M
      disk-quota: 512M
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests
      build-result: target/*-exec.jar
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: ba-backend-cap-ias-xsuaa
      - name: ba-backend-cap-ias-identity
      - name: ba-backend-cap-ias-destination

  # --------------------- APP ROUTER (Angular + Auth) ----------
  - name: ba-backend-cap-ias-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 512M
      memory: 256M
    build-parameters:
      builder: custom
      commands:
        - npm install
      requires:
        - name: ba-frontend-angular
          artifacts:
            - ./*
          target-path: resources
    requires:
      - name: ba-backend-cap-ias-xsuaa
      - name: ba-backend-cap-ias-identity
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
    provides:
      - name: app-url
        properties:
          url: ${default-url}

  # --------------------- FRONTEND BUILD -----------------------
  - name: ba-frontend-angular
    type: html5
    path: ../ba-frontend-angular
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build -- --configuration=production
      build-result: dist/ba-frontend-angular/browser
      supported-platforms: []

resources:
  - name: ba-backend-cap-ias-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ba-backend-cap-ias-${org}-${space}
        tenant-mode: dedicated

  # --------------------- SAP IAS (Identity Service) ----
  - name: ba-backend-cap-ias-identity
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-plan: application
      config:
        display-name: BA-CAP-IAS-Bachelor-Thesis
        oauth2-configuration:
          redirect-uris:
            - https://*.cfapps.us10-001.hana.ondemand.com/**
            - https://*.cfapps.eu10.hana.ondemand.com/**
          post-logout-redirect-uris:
            - https://*.cfapps.us10-001.hana.ondemand.com/**
        credential-types:
          - binding-secret

  # --------------------- DESTINATION SERVICE --------------
  - name: ba-backend-cap-ias-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: false
        version: 1.0.0
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true

