# SAP CAP + SAP IAS Backend Configuration
# Bachelor Thesis: Comparing SAP CAP vs. AWS Cognito

---
spring:
  config.activate.on-profile: default
  application:
    name: sap-cap-backend-ias

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:capdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  sql.init.platform: h2

  # CRITICAL for H5: SAP IAS Token Validation
  # NOTE: This is MINIMAL configuration compared to AWS Cognito!
  # - No manual JWKS URI configuration in code
  # - No manual JWT processor setup
  # - Framework handles EVERYTHING automatically via Service Binding
  security:
    oauth2:
      resourceserver:
        jwt:
          # These will be automatically populated via Service Binding in SAP BTP
          # For local testing, you can set them here:
          issuer-uri: ${IAS_ISSUER_URI:https://your-tenant.accounts.ondemand.com}
          jwk-set-uri: ${IAS_JWKS_URI:https://your-tenant.accounts.ondemand.com/oauth2/certs}

# SAP CAP Configuration
cds:
  # ============================================================
  # SAP CAP übernimmt die Security-Konfiguration automatisch!
  # ============================================================
  # LOKAL (default Profil):
  # - Mock-User aus .cdsrc.json
  # - @restrict Annotationen werden durchgesetzt
  #
  # CLOUD (cloud Profil):
  # - XSUAA/SAP IAS über Service Binding
  # - @restrict Annotationen werden durchgesetzt
  # - Automatische JWT Token Validierung
  #
  # WICHTIG: Keine eigene SecurityFilterChain nötig!
  # Das ist der Kernunterschied zu Spring Boot + AWS Cognito.
  # ============================================================
  security:
    mock:
      enabled: true  # Aktiviert Mock-User aus .cdsrc.json

  # OData V4 Configuration
  odata:
    v4:
      enabled: true
      endpoint:
        path: /odata/v4

  # Data Source Configuration
  data-source:
    auto-config:
      enabled: false

  # SQL Configuration
  sql:
    supportedLocales:
      - en
      - de

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration for Hypothesis Testing
logging:
  level:
    root: INFO
    customer.ba_backend_cap_ias: DEBUG
    com.sap.cds: DEBUG
    com.sap.cloud.security: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

# Metrics for Case Study
metrics:
  security:
    lines-of-code:
      enabled: true
  time-to-first-token:
    enabled: true
  coupling:
    enabled: true

---
# Test Profile - Disables security for local unit tests
spring:
  config.activate.on-profile: test

cds:
  security:
    enabled: false
    mock:
      enabled: true

logging:
  level:
    customer.ba_backend_cap_ias: TRACE

---
# Production Profile - Full SAP IAS Integration
spring:
  config.activate.on-profile: cloud

  # H2 Database auch in Cloud für Demo-Zwecke
  datasource:
    url: jdbc:h2:mem:capdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

cds:
  security:
    # In der Cloud: XSUAA übernimmt die Authentifizierung
    # Service Binding liefert automatisch alle Konfiguration
    xsuaa:
      enabled: true
    mock:
      enabled: false

logging:
  level:
    root: WARN
    customer.ba_backend_cap_ias: INFO
