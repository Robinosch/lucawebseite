# SAP CAP + SAP IAS Backend Configuration
---
spring:
  config.activate.on-profile: default
  application:
    name: sap-cap-backend-ias

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:capdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  sql.init.platform: h2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IAS_ISSUER_URI:https://al3kyocay.trial-accounts.ondemand.com}
          jwk-set-uri: ${IAS_JWKS_URI:https://al3kyocay.trial-accounts.ondemand.com/oauth2/certs}

# SAP CAP Configuration
cds:
  security:
    mock:
      enabled: true
      default-users:
        enabled: true
      users:
        - name: admin@test.com
          password: admin123
          roles:
            - 'Admin'
        - name: manager@test.com
          password: manager123
          roles:
            - 'Manager'
        - name: user@test.com
          password: user123
          roles:
            - 'User'
        - name: observer@test.com
          password: observer123
          roles:
            - 'Observer'

  # OData V4 Configuration
  odata:
    v4:
      enabled: true
      endpoint:
        path: /odata/v4

  # Data Source Configuration
  data-source:
    auto-config:
      enabled: false

  # SQL Configuration
  sql:
    supportedLocales:
      - en
      - de

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration for Hypothesis Testing
logging:
  level:
    root: INFO
    customer.ba_backend_cap_ias: DEBUG
    com.sap.cds: DEBUG
    com.sap.cloud.security: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'


---
# Test Profile
spring:
  config.activate.on-profile: test

cds:
  security:
    enabled: false
    mock:
      enabled: true

logging:
  level:
    customer.ba_backend_cap_ias: TRACE

---
# Production Profile - SAP BTP Cloud Deployment mit SAP IAS
spring:
  config.activate.on-profile: cloud

  # H2 Database
  datasource:
    url: jdbc:h2:mem:capdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${vcap.services.ba-backend-cap-ias-xsuaa.credentials.url:https://ea92a7aatrial.authentication.us10.hana.ondemand.com}/token_keys

cds:
  security:
    xsuaa:
      enabled: true
    identity:
      enabled: true
    mock:
      enabled: false

logging:
  level:
    root: WARN
    customer.ba_backend_cap_ias: INFO
    com.sap.cloud.security: DEBUG
