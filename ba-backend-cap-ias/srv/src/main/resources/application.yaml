---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IAS_ISSUER_URI:https://your-ias-domain.accounts.ondemand.com/oauth2/certs}
          jwk-set-uri: ${IAS_JWKS_URI:https://your-ias-domain.accounts.ondemand.com/oauth2/certs}
cds:
  data-source.auto-config.enabled: false
  security:
    enabled: true

---
# test profile can disable security for local tests
spring:
  config.activate.on-profile: test
cds:
  security.enabled: false
