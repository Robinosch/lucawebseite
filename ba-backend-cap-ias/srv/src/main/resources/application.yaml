# SAP CAP + SAP IAS Backend Configuration
# Bachelor Thesis: Comparing SAP CAP vs. AWS Cognito

---
spring:
  config.activate.on-profile: default
  application:
    name: sap-cap-backend-ias

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:capdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  sql.init.platform: h2

  # CRITICAL for H5: SAP IAS Token Validation
  # NOTE: This is MINIMAL configuration compared to AWS Cognito!
  # - No manual JWKS URI configuration in code
  # - No manual JWT processor setup
  # - Framework handles EVERYTHING automatically via Service Binding
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IAS_ISSUER_URI:https://al3kyocay.trial-accounts.ondemand.com}
          jwk-set-uri: ${IAS_JWKS_URI:https://al3kyocay.trial-accounts.ondemand.com/oauth2/certs}

# SAP CAP Configuration
cds:
  # ============================================================
  # SAP CAP übernimmt die Security-Konfiguration automatisch!
  # ============================================================
  # LOKAL (default Profil):
  # - Mock-User aus .cdsrc.json
  # - @restrict Annotationen werden durchgesetzt
  #
  # CLOUD (cloud Profil):
  # - XSUAA/SAP IAS über Service Binding
  # - @restrict Annotationen werden durchgesetzt
  # - Automatische JWT Token Validierung
  #
  # WICHTIG: Keine eigene SecurityFilterChain nötig!
  # Das ist der Kernunterschied zu Spring Boot + AWS Cognito.
  # ============================================================
  security:
    mock:
      enabled: true  # Aktiviert Mock-User aus .cdsrc.json
      default-users:
        enabled: true
      users:
        - name: admin@test.com
          password: admin123
          roles:
            - 'Admin'
        - name: manager@test.com
          password: manager123
          roles:
            - 'Manager'
        - name: user@test.com
          password: user123
          roles:
            - 'User'
        - name: observer@test.com
          password: observer123
          roles:
            - 'Observer'

  # OData V4 Configuration
  odata:
    v4:
      enabled: true
      endpoint:
        path: /odata/v4

  # Data Source Configuration
  data-source:
    auto-config:
      enabled: false

  # SQL Configuration
  sql:
    supportedLocales:
      - en
      - de

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration for Hypothesis Testing
logging:
  level:
    root: INFO
    customer.ba_backend_cap_ias: DEBUG
    com.sap.cds: DEBUG
    com.sap.cloud.security: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

# Metrics for Case Study
metrics:
  security:
    lines-of-code:
      enabled: true
  time-to-first-token:
    enabled: true
  coupling:
    enabled: true

---
# Test Profile - Disables security for local unit tests
spring:
  config.activate.on-profile: test

cds:
  security:
    enabled: false
    mock:
      enabled: true

logging:
  level:
    customer.ba_backend_cap_ias: TRACE

---
# Production Profile - SAP BTP Cloud Deployment mit SAP IAS
spring:
  config.activate.on-profile: cloud

  # H2 Database auch in Cloud für Demo-Zwecke
  datasource:
    url: jdbc:h2:mem:capdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  # OAuth2 Resource Server Configuration
  # Die JWKS URI wird automatisch aus VCAP_SERVICES gelesen
  # Fallback: Manuell konfigurieren falls nötig
  security:
    oauth2:
      resourceserver:
        jwt:
          # XSUAA JWKS URI wird automatisch aus Service Binding gelesen
          # Format: https://<subdomain>.authentication.<region>.hana.ondemand.com/token_keys
          jwk-set-uri: ${vcap.services.ba-backend-cap-ias-xsuaa.credentials.url:https://ea92a7aatrial.authentication.us10.hana.ondemand.com}/token_keys

cds:
  security:
    # ARCHITEKTUR: XSUAA (Authorization) + SAP IAS (Identity)
    # - XSUAA übernimmt OAuth2 Token Management und Scopes/Rollen
    # - SAP IAS übernimmt User-Authentifizierung (via Trust in BTP)
    # - Der App-Router leitet automatisch zur SAP IAS Login-Seite
    xsuaa:
      enabled: true
    identity:
      enabled: true
    mock:
      enabled: false

logging:
  level:
    root: WARN
    customer.ba_backend_cap_ias: INFO
    com.sap.cloud.security: DEBUG
